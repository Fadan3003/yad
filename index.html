.x{background:none;font-size:22px;color:var(--mu)}.bar{flex:1;height:14px;background:var(--bd);border-radius:9px;overflow:hidden}

main{flex:1;padding:8px 22px}main h2{font-size:24px;margin:8px 0 12px}main p{color:var(--mu);font-size:17px}

.bl{display:inline-block;min-width:70px;border-bottom:2px dashed #b8f7d4;color:#fff;text-align:center;cursor:pointer}

footer{padding:16px 22px 20px;border-top:2px solid var(--bd)}footer.ok{background:var(--okb)}footer.ko{background:var(--kob)}

.b{width:100%;background:var(--pr);color:#fff;font-weight:800;font-size:17px;padding:14px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.b:disabled{background:var(--bd);color:var(--mu);box-shadow:none;cursor:default}footer.ok .b{background:var(--ok)}footer.ko .b{background:var(--ko)}

const UI={en:{ck:"Check",co:"Continue",ok:"Correct! +10 XP",ko:"Not quite",an:"Answer: ",done:"Lesson complete!",xp:"XP",ac:"ACCURACY",stk:"STREAK",rs:"Reset progress",rs2:"Tap again to reset"},de:{ck:"Prüfen",co:"Weiter",ok:"Richtig! +10 XP",ko:"Nicht ganz",an:"Antwort: ",done:"Lektion geschafft!",xp:"XP",ac:"GENAUIGKEIT",stk:"SERIE",rs:"Fortschritt zurücksetzen",rs2:"Nochmal tippen zum Zurücksetzen"}};
const de=()=>S.lang==="de",g=k=>UI[de()?"de":"en"][k];
const tt=f=>de()?DE[f.ui][2][f.li][0]:f.t;
function loc(s,f,i){if(!de())return s;const e=DE[f.ui][2][f.li][1][i];if(s.k==="i")return{...s,h:e[0],p:e[1]};if(s.k==="c")return{...s,q:e[0],o:e[1]||s.o,x:e[2]||s.x};return{...s,q:e[0],x:e[1]||s.x}}
function tgl(){S.lang=de()?"en":"de";save();home()}
function pl(l){S.lang=l;save();home()}
function chooser(){A.innerHTML=`<div class="fin"><div class="em">🪟</div><h1>YadLearn</h1><p style="color:var(--mu)">Choose your learning language<br>Wähle deine Lernsprache</p><button class="b" style="margin:18px 0 10px" onclick="pl('en')">English</button><button class="b" onclick="pl('de')">Deutsch</button></div>`}
let L;
function home(){
 let h=`<div class="hd"><b>🪟 YadLearn</b><div class="st"><button class="lg" onclick="tgl()">🌐 ${de()?"DE":"EN"}</button><span>🔥 ${S.st}</span><span>⚡ ${S.xp}</span></div></div>`;
 U.forEach((u,ui)=>{h+=`<div class="un" style="background:${u.c}"><h3>${de()?DE[ui][0]:u.n}</h3><p>${de()?DE[ui][1]:u.d}</p></div><div class="path">`;
  flat.filter(f=>f.ui===ui).forEach(f=>{const i=flat.indexOf(f),open=i===0||S.done[flat[i-1].id],dn=S.done[f.id],off=[0,38,0,-38][i%4];
   h+=`<button class="nd ${open?(dn?"":"cur"):"lk"}" style="background:${u.c};transform:translateX(${off}px)" ${open?`onclick="lesson('${f.id}')"`:""}>${dn?"✓":open?f.e:"🔒"}<small>${tt(f)}</small></button>`});
  h+=`</div><div style="height:14px"></div>`});
 h+=`<p style="text-align:center;padding-bottom:20px"><button class="x" style="font-size:13px" onclick="rst(this)">${g("rs")}</button></p>`;A.innerHTML=h}
function rst(b){if(!b.dataset.s){b.dataset.s=1;b.textContent=g("rs2");return}S={xp:0,st:0,last:"",done:{},lang:S.lang};save();home()}
function shell(b,f){A.innerHTML=`<div class="top"><button class="x" onclick="home()">✕</button><div class="bar"><i style="width:${L.d/L.n*100}%"></i></div></div><main>${b}</main><footer id="ft">${f}</footer>`}
function lesson(id){const l=flat.find(x=>x.id===id);L={l,q:l.s.map((s,i)=>loc(s,l,i)),n:l.s.length,d:0,xp:0,err:0};step()}
function step(){
 if(!L.q.length)return fin();
 const s=L.q[0];L.sel=null;L.lock=false;
 const chk=`<button class="b" id="ck" disabled onclick="check()">${g("ck")}</button>`;
 if(s.k==="i")return shell(`<h2>${e(s.h)}</h2><p>${e(s.p)}</p><pre>${e(s.c)}</pre>`,`<button class="b" onclick="nxt(1)">${g("co")}</button>`);
 if(s.k==="c"){L.o=shuf(s.o.map((t,i)=>({t,ok:i===s.a})));
  return shell(`<h2>${e(s.q)}</h2>`+L.o.map((o,i)=>`<button class="o" id="o${i}" onclick="pick(${i})">${e(o.t)}</button>`).join(""),chk)}
 L.o=shuf(s.o);
 shell(`<h2>${e(s.q)}</h2><pre>${e(s.c).replace("___",'<span class="bl" id="bl" onclick="unp()">&nbsp;</span>')}</pre><div class="ch">${L.o.map((t,i)=>`<button class="o" id="o${i}" onclick="pick(${i})">${e(t)}</button>`).join("")}</div>`,chk)}
function pick(i){if(L.lock)return;const s=L.q[0];
 if(s.k==="c"){document.querySelectorAll(".o").forEach(b=>b.classList.remove("s"));document.getElementById("o"+i).classList.add("s");L.sel=i}
 else{unp();L.sel=L.o[i];L.si=i;document.getElementById("bl").textContent=L.sel;document.getElementById("o"+i).style.visibility="hidden"}
 document.getElementById("ck").disabled=false}
function unp(){if(L.lock||L.sel==null||L.q[0].k!=="f")return;document.getElementById("o"+L.si).style.visibility="";document.getElementById("bl").innerHTML="&nbsp;";L.sel=null;document.getElementById("ck").disabled=true}
function check(){const s=L.q[0];L.lock=true;let ok,ans;
 if(s.k==="c"){ok=L.o[L.sel].ok;ans=s.o[s.a];document.getElementById("o"+L.sel).classList.add(ok?"ok":"ko");if(!ok){const c=L.o.findIndex(o=>o.ok);document.getElementById("o"+c).classList.add("ok")}}
 else{ok=L.sel===s.a;ans=s.a}
 if(ok)L.xp+=10;else L.err++;
 const f=document.getElementById("ft");f.className=ok?"ok":"ko";
 f.innerHTML=`<p><b>${ok?g("ok"):g("ko")}</b>${ok?"":g("an")+e(ans)+(s.x?" – ":"")}${e(s.x||"")}</p><button class="b" onclick="nxt(${ok?1:0})">${g("co")}</button>`}
function nxt(ok){const s=L.q.shift();if(ok)L.d++;else L.q.push(s);step()}
function fin(){
 const gain=L.xp+20,t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
 if(S.last!==t){S.st=S.last===y?S.st+1:1;S.last=t}
 S.xp+=gain;S.done[L.l.id]=1;save();
 const q=L.l.s.filter(s=>s.k!=="i").length,acc=Math.max(0,Math.round(100*q/(q+L.err)));
 A.innerHTML=`<div class="fin"><div class="em">🎉</div><h1>${g("done")}</h1><p style="color:var(--mu)">${e(tt(L.l))}</p><div class="sc"><div>⚡ ${gain}<small>${g("xp")}</small></div><div>🎯 ${acc}%<small>${g("ac")}</small></div><div>🔥 ${S.st}<small>${g("stk")}</small></div></div><button class="b" onclick="home()">${g("co")}</button></div>`}
S.lang?home():chooser();
</script></body></html>
